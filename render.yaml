services:
  - type: web
    name: swappa-api
    runtime: node
    rootDir: api
    plan: free
    # --include=dev overrides npm's default of skipping devDependencies when
    # NODE_ENV=production is set — tsc (a devDependency) is needed to build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: swappa_production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: LOCATION_FUZZ_SALT
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false

  - type: web
    name: swappa-web
    runtime: static
    rootDir: mobile
    # Static-site builders don't ship the Flutter SDK, so the build command
    # fetches it itself — pinned to the exact stable version this was built
    # and tested against locally (`flutter --version`).
    buildCommand: |
      git clone https://github.com/flutter/flutter.git -b 3.44.4 --depth 1 _flutter
      export PATH="$PATH:$PWD/_flutter/bin"
      flutter config --enable-web
      flutter pub get
      flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL
    staticPublishPath: build/web
    envVars:
      - key: API_BASE_URL
        value: https://swappa-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
